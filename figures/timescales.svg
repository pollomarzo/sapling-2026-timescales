<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="360" fill="#ffffff"/>

  <!-- y gridlines and ticks: 0,10,20,30,40 -->
  <g stroke="#e2e6e3" stroke-width="1">
    <line x1="60" y1="310" x2="540" y2="310"/>
    <line x1="60" y1="245.56" x2="540" y2="245.56"/>
    <line x1="60" y1="181.11" x2="540" y2="181.11"/>
    <line x1="60" y1="116.67" x2="540" y2="116.67"/>
    <line x1="60" y1="52.22" x2="540" y2="52.22"/>
  </g>
  <g fill="#4a544d" font-size="12" text-anchor="end">
    <text x="52" y="314">0</text>
    <text x="52" y="249.56">10</text>
    <text x="52" y="185.11">20</text>
    <text x="52" y="120.67">30</text>
    <text x="52" y="56.22">40</text>
  </g>

  <!-- axes -->
  <g stroke="#1a1f1c" stroke-width="1.5">
    <line x1="60" y1="20" x2="60" y2="310"/>
    <line x1="60" y1="310" x2="540" y2="310"/>
  </g>

  <!-- across-seed band (mean +/- 1 sd) -->
  <polygon fill="#2f6b4f" fill-opacity="0.15" stroke="none"
    points="60,285.51 128.57,271.33 197.14,250.71 265.71,223 334.29,187.56 402.86,139.22 471.43,84.44 540,29.67 540,74.78 471.43,123.11 402.86,171.44 334.29,213.33 265.71,242.33 197.14,266.18 128.57,284.22 60,295.82"/>

  <!-- mean trend line -->
  <polyline fill="none" stroke="#2f6b4f" stroke-width="2.5"
    points="60,290.67 128.57,277.78 197.14,258.44 265.71,232.67 334.29,200.44 402.86,155.33 471.43,103.78 540,52.22"/>

  <!-- mean points -->
  <g fill="#2f6b4f">
    <circle cx="60" cy="290.67" r="4"/>
    <circle cx="128.57" cy="277.78" r="4"/>
    <circle cx="197.14" cy="258.44" r="4"/>
    <circle cx="265.71" cy="232.67" r="4"/>
    <circle cx="334.29" cy="200.44" r="4"/>
    <circle cx="402.86" cy="155.33" r="4"/>
    <circle cx="471.43" cy="103.78" r="4"/>
    <circle cx="540" cy="52.22" r="4"/>
  </g>

  <!-- x ticks and labels: levels 1..8 -->
  <g fill="#4a544d" font-size="12" text-anchor="middle">
    <text x="60" y="328">1</text>
    <text x="128.57" y="328">2</text>
    <text x="197.14" y="328">3</text>
    <text x="265.71" y="328">4</text>
    <text x="334.29" y="328">5</text>
    <text x="402.86" y="328">6</text>
    <text x="471.43" y="328">7</text>
    <text x="540" y="328">8</text>
  </g>

  <!-- axis titles -->
  <text x="300" y="352" fill="#1a1f1c" font-size="13" text-anchor="middle">Hierarchical level</text>
  <text x="18" y="165" fill="#1a1f1c" font-size="13" text-anchor="middle" transform="rotate(-90 18 165)">Intrinsic timescale (steps)</text>
</svg>
